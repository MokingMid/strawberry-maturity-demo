# Render 蓝图 —— 在 GitHub 仓库页面点 "Deploy to Render" 即可一键部署
#
# 使用方法：
#   1. 把本仓库推到 GitHub（公开仓库）
#   2. 打开 https://render.com/deploy  → 选这个仓库 → Apply
#   3. 部署完成后会给出 https://<你的服务名>.onrender.com 地址
#
# 免费版说明：空闲 15 分钟后实例会休眠，首次访问需等待约 1 分钟冷启动。
# 模型已随仓库提交（models/），部署时不需要额外下载。

services:
  - type: web
    name: strawberry-maturity-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/samples?size=1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true
